{% extends 'base.html' %}
{% load static %}

{% block auth_content %}
<div class="login-container">
    <div class="login-card card">
        <div class="card-header">
            <div class="mb-2">
                <i class="bi bi-droplet-fill" style="font-size: 2rem;"></i>
            </div>
            <h4>Blood Bank Management</h4>
            <p class="mb-0 mt-1" style="opacity: 0.95; font-size: 0.875rem;">Sign in to your admin account</p>
        </div>
        <div class="card-body">
            {% if form.errors %}
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle me-2"></i>Invalid username or password. Please try again.
                </div>
            {% endif %}
            <form method="post" class="mb-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="id_password" class="form-label mb-0">Password</label>
                        <a href="#" class="forgot-password" onclick="alert('Please contact system administrator to reset password.'); return false;">Forgot password?</a>
                    </div>
                    <input type="password" name="password" class="form-control" id="id_password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 mt-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
            
            <div class="login-divider">
                <span>or continue with</span>
            </div>
            
            <button type="button" class="btn social-login-btn" onclick="alert('Google login integration coming soon.');">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
                Sign in with Google
            </button>
            
            <button type="button" class="btn social-login-btn" onclick="alert('Apple login integration coming soon.');">
                <i class="bi bi-apple" style="font-size: 1.25rem;"></i>
                Sign in with Apple
            </button>
        </div>
    </div>
</div>
{% endblock %}
